name: Run220 focused history support audit
on:
  pull_request:
    paths:
      - 'verification/check_two_shared_rows.py'
      - 'verification/test_two_shared_rows.py'
      - '.github/workflows/run220-history-audit.yml'
  workflow_dispatch:
jobs:
  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install scipy==1.17.0
      - name: Focused exact tests
        run: PYTHONPATH=verification python -m unittest -v verification.test_two_shared_rows
      - name: Actual tick-193 integration
        run: RUN_TICK193_AUDIT=1 PYTHONPATH=verification python -m unittest -v verification.test_two_shared_rows
      - name: Report tick-193 exact-certified support and wall time
        run: |
          PYTHONPATH=verification python - <<'PY'
          import json, time
          from check_two_shared_rows import audit_tick193
          start=time.perf_counter()
          result=audit_tick193()
          print("RUN220_AUDIT_JSON="+json.dumps(result,sort_keys=True))
          print("RUN220_AUDIT_WALL_SECONDS="+str(time.perf_counter()-start))
          PY
