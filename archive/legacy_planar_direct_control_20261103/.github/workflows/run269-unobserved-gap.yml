name: Run269 unobserved velocity information floor

on:
  pull_request:
    paths:
      - 'verification/check_run269_unobserved_gap.py'
      - 'verification/test_run269_unobserved_gap.py'
      - 'results/run269_unobserved_gap_20261102/checks.json'
      - '.github/workflows/run269-unobserved-gap.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_run269_unobserved_gap.py'
      - 'verification/test_run269_unobserved_gap.py'
      - 'results/run269_unobserved_gap_20261102/checks.json'
      - '.github/workflows/run269-unobserved-gap.yml'

jobs:
  run269:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m py_compile verification/check_run269_unobserved_gap.py verification/test_run269_unobserved_gap.py
      - name: Focused Run26x regression
        run: PYTHONPATH=verification python -m unittest discover -s verification -p 'test_run26*.py' -v
      - name: Frozen config and exact rational archive
        run: |
          python verification/check_run269_unobserved_gap.py --root . --output /tmp/run269_checks.json
          diff -u results/run269_unobserved_gap_20261102/checks.json /tmp/run269_checks.json
