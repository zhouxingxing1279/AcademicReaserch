name: Run262 exact hover torque-delay necessary bound
on:
  pull_request:
    paths:
      - 'verification/check_run262_actuation_delay.py'
      - 'verification/test_run262_actuation_delay.py'
      - 'results/run262_actuation_delay_20261102/checks.json'
      - '.github/workflows/run262-actuation-delay.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_run262_actuation_delay.py'
      - 'verification/test_run262_actuation_delay.py'
      - 'results/run262_actuation_delay_20261102/checks.json'
      - '.github/workflows/run262-actuation-delay.yml'
  workflow_dispatch:
jobs:
  exact-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run262 and focused Run260-261 regressions
        working-directory: verification
        run: |
          PYTHONPATH=. python -m unittest -v test_run260_conditional_shared_bridge test_run261_zero_torque_nonterminal test_run262_actuation_delay
      - name: Compile, frozen-config crosscheck and exact certificate
        run: |
          python -m py_compile verification/check_run262_actuation_delay.py verification/test_run262_actuation_delay.py
          cd verification
          PYTHONPATH=. python check_run262_actuation_delay.py --root .. --output /tmp/run262_checks.json
          cmp /tmp/run262_checks.json ../results/run262_actuation_delay_20261102/checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: run262-exact-bound
          path: results/run262_actuation_delay_20261102/checks.json
