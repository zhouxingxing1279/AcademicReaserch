name: Run248 early corner nonviability certificate
on:
  pull_request:
    paths:
      - 'verification/check_four_state_corner_viability.py'
      - 'verification/test_four_state_corner_viability.py'
      - 'results/four_state_corner_viability_20261101/checks.json'
      - '.github/workflows/run248-corner-viability.yml'
      - 'configs/planar_baseline.json'
  push:
    branches: [main]
    paths:
      - 'verification/check_four_state_corner_viability.py'
      - 'verification/test_four_state_corner_viability.py'
      - '.github/workflows/run248-corner-viability.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run224-248 focused regressions and exact Run248 certificate
        env:
          PYTHONPATH: verification
        run: |
          python -V
          python -m py_compile verification/check_four_state_corner_viability.py verification/test_four_state_corner_viability.py
          python -m unittest -v verification.test_four_state_one_step_predecessor verification.test_four_state_two_step_predecessor verification.test_four_state_three_step_predecessor verification.test_four_state_terminal_bridge verification.test_four_state_bridge_graph verification.test_four_state_bridge_branching verification.test_four_state_position_guard verification.test_four_state_cell_position_guard verification.test_four_state_bridge_multistep_obstruction verification.test_four_state_feedback_seed verification.test_four_state_rpi_zonotope verification.test_four_state_finite_rpi verification.test_four_state_shared_torque verification.test_four_state_shared_successor verification.test_four_state_fiber_recovery verification.test_four_state_posterior_strip verification.test_four_state_all_observations verification.test_four_state_observation_pulse verification.test_four_state_repeated_pulse verification.test_four_state_posterior_damping verification.test_four_state_pulse_authority verification.test_four_state_tilt_authority verification.test_four_state_terminal_nonviability verification.test_four_state_early_viability_guard verification.test_four_state_corner_viability
          python verification/check_four_state_corner_viability.py --root . --output /tmp/run248_certificate.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          expected=json.load(open('results/four_state_corner_viability_20261101/checks.json'))
          actual=json.load(open('/tmp/run248_certificate.json'))
          assert expected==actual, 'Run248 exact archived certificate mismatch'
          assert actual['run']==248
          assert actual['first_rejection_within_prefix_and_horizon_le_30']==14
          assert actual['unavoidable_velocity_violation_by_tick']==44
          assert F(actual['rigorous_upper_velocity_at_tick44']) < -3
          assert F(actual['strict_negative_violation_margin_m_s']) > 0
          assert not actual['recursive_feasibility_proved']
          print('Run248 exact full-information corner obstruction matches archive')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run248-exact-corner-viability
          path: /tmp/run248_certificate.json
