name: Run263 all-reading measurement-epoch width bound
on:
  pull_request:
    paths:
      - 'verification/check_run263_epoch_velocity_width.py'
      - 'verification/test_run263_epoch_velocity_width.py'
      - 'results/run263_epoch_velocity_width_20261102/checks.json'
      - '.github/workflows/run263-epoch-velocity-width.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_run263_epoch_velocity_width.py'
      - 'verification/test_run263_epoch_velocity_width.py'
      - 'results/run263_epoch_velocity_width_20261102/checks.json'
      - '.github/workflows/run263-epoch-velocity-width.yml'
  workflow_dispatch:
jobs:
  exact-width:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run263 and focused Run260-262 regressions
        working-directory: verification
        run: |
          PYTHONPATH=. python -m unittest -v test_run260_conditional_shared_bridge test_run261_zero_torque_nonterminal test_run262_actuation_delay test_run263_epoch_velocity_width
      - name: Compile, config crosscheck and exact certificate
        run: |
          python -m py_compile verification/check_run263_epoch_velocity_width.py verification/test_run263_epoch_velocity_width.py
          cd verification
          PYTHONPATH=. python check_run263_epoch_velocity_width.py --root .. --output /tmp/run263_checks.json
          cmp /tmp/run263_checks.json ../results/run263_epoch_velocity_width_20261102/checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: run263-exact-width
          path: results/run263_epoch_velocity_width_20261102/checks.json
