name: Run246 reachable terminal nonviability certificate
on:
  pull_request:
    paths:
      - 'verification/check_four_state_terminal_nonviability.py'
      - 'verification/test_four_state_terminal_nonviability.py'
      - 'results/four_state_terminal_nonviability_20261101/checks.json'
      - '.github/workflows/run246-terminal-nonviability.yml'
      - 'configs/planar_baseline.json'
  push:
    branches: [main]
    paths:
      - 'verification/check_four_state_terminal_nonviability.py'
      - 'verification/test_four_state_terminal_nonviability.py'
      - '.github/workflows/run246-terminal-nonviability.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run224-246 focused regressions and exact necessary viability guard
        env:
          PYTHONPATH: verification
        run: |
          python -V
          python -m py_compile verification/check_four_state_terminal_nonviability.py verification/test_four_state_terminal_nonviability.py
          python -m unittest -v verification.test_four_state_one_step_predecessor verification.test_four_state_two_step_predecessor verification.test_four_state_three_step_predecessor verification.test_four_state_terminal_bridge verification.test_four_state_bridge_graph verification.test_four_state_bridge_branching verification.test_four_state_position_guard verification.test_four_state_cell_position_guard verification.test_four_state_bridge_multistep_obstruction verification.test_four_state_feedback_seed verification.test_four_state_rpi_zonotope verification.test_four_state_finite_rpi verification.test_four_state_shared_torque verification.test_four_state_shared_successor verification.test_four_state_fiber_recovery verification.test_four_state_posterior_strip verification.test_four_state_all_observations verification.test_four_state_observation_pulse verification.test_four_state_repeated_pulse verification.test_four_state_posterior_damping verification.test_four_state_pulse_authority verification.test_four_state_tilt_authority verification.test_four_state_terminal_nonviability
          python verification/check_four_state_terminal_nonviability.py --root . --output /tmp/run246_certificate.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          expected=json.load(open('results/four_state_terminal_nonviability_20261101/checks.json'))
          actual=json.load(open('/tmp/run246_certificate.json'))
          assert expected==actual, 'Run246 exact archived certificate mismatch'
          assert actual['run']==246
          assert F(actual['velocity_upper_bound_at_tick43'])<-3
          assert F(actual['strict_velocity_violation_margin'])>0
          assert F(actual['tick30_velocity_enclosure'][1])<F(actual['necessary_velocity_floor_at_tick30'])
          assert not actual['general_smf_mpc_impossible']
          print('Run246 exact reachable terminal nonviability certificate matches archive')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run246-exact-terminal-nonviability
          path: /tmp/run246_certificate.json
