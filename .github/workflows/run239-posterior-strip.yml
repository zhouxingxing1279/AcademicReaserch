name: Run239 exact noisy-position SMF posterior
on:
  pull_request:
    paths:
      - 'verification/check_four_state_posterior_strip.py'
      - 'verification/test_four_state_posterior_strip.py'
      - 'results/four_state_posterior_strip_20261101/checks.json'
      - '.github/workflows/run239-posterior-strip.yml'
      - 'configs/planar_baseline.json'
  push:
    branches: [main]
    paths:
      - 'verification/check_four_state_posterior_strip.py'
      - 'verification/test_four_state_posterior_strip.py'
      - '.github/workflows/run239-posterior-strip.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run224-239 focused tests and exact conditional posterior certificate
        env:
          PYTHONPATH: verification
        run: |
          python -V
          python -m py_compile verification/check_four_state_posterior_strip.py verification/test_four_state_posterior_strip.py
          python -m unittest -v verification.test_four_state_one_step_predecessor verification.test_four_state_two_step_predecessor verification.test_four_state_three_step_predecessor verification.test_four_state_terminal_bridge verification.test_four_state_bridge_graph verification.test_four_state_bridge_branching verification.test_four_state_position_guard verification.test_four_state_cell_position_guard verification.test_four_state_bridge_multistep_obstruction verification.test_four_state_feedback_seed verification.test_four_state_rpi_zonotope verification.test_four_state_finite_rpi verification.test_four_state_shared_torque verification.test_four_state_shared_successor verification.test_four_state_fiber_recovery verification.test_four_state_posterior_strip
          python verification/check_four_state_posterior_strip.py --root . --output /tmp/run239_certificate.json
          diff -u results/four_state_posterior_strip_20261101/checks.json /tmp/run239_certificate.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          a=json.load(open('/tmp/run239_certificate.json'))
          assert a['run']==239
          assert F(a['posterior_velocity_halfwidth_exact'])==F(353411321,960000000)
          assert F(a['unconditioned_velocity_halfwidth_at_observation_y_equal_prior_p'])==F(52180511,80000000)
          assert a['conditional_additional_15_tick_state_and_input_safe']
          assert not a['recursive_invariance_certified']
          print('Run239 conditional posterior verified; no recursive guarantee')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run239-exact-noisy-posterior
          path: /tmp/run239_certificate.json
