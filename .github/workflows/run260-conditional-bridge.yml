name: Run260 conditional shared 15-tick safety bridge
on:
  pull_request:
    paths:
      - 'verification/check_run260_conditional_shared_bridge.py'
      - 'verification/test_run260_conditional_shared_bridge.py'
      - 'results/run260_conditional_shared_bridge_20261102/checks.json'
      - '.github/workflows/run260-conditional-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_run260_conditional_shared_bridge.py'
      - 'verification/test_run260_conditional_shared_bridge.py'
      - 'results/run260_conditional_shared_bridge_20261102/checks.json'
      - '.github/workflows/run260-conditional-bridge.yml'
  workflow_dispatch:
jobs:
  exact-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused regressions Run249-260
        working-directory: verification
        run: |
          PYTHONPATH=. python -m unittest -v test_four_state_shielded_smf_mpc test_four_state_zero_backup_horizon test_velocity_indistinguishability test_dropout_velocity_fiber test_forced_reobservation_bridge test_forced_success_velocity_alias test_run255_posterior_bridge test_run256_interval_information_limit test_run257_correlated_position_velocity test_run258_delayed_anchor test_run259_rolling_anchor test_run260_conditional_shared_bridge
      - name: Compile, real-config crosscheck and exact certificate
        run: |
          python -m py_compile verification/check_run260_conditional_shared_bridge.py verification/test_run260_conditional_shared_bridge.py
          cd verification
          PYTHONPATH=. python check_run260_conditional_shared_bridge.py --root .. --output /tmp/run260_checks.json
          cmp /tmp/run260_checks.json ../results/run260_conditional_shared_bridge_20261102/checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: run260-exact-certificate
          path: results/run260_conditional_shared_bridge_20261102/checks.json
