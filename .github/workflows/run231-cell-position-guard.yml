name: Run231 exact full-cell position guard
on:
  pull_request:
    paths:
      - 'verification/check_four_state_cell_position_guard.py'
      - 'verification/test_four_state_cell_position_guard.py'
      - 'verification/check_four_state_bridge_graph.py'
      - 'configs/planar_baseline.json'
      - '.github/workflows/run231-cell-position-guard.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_four_state_cell_position_guard.py'
      - 'verification/test_four_state_cell_position_guard.py'
      - '.github/workflows/run231-cell-position-guard.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run224-231 exact focused regression and full-config audit
        env:
          PYTHONPATH: verification
        run: |
          python -V
          python -m py_compile verification/check_four_state_cell_position_guard.py verification/test_four_state_cell_position_guard.py
          python -m unittest -v verification.test_four_state_one_step_predecessor verification.test_four_state_two_step_predecessor verification.test_four_state_three_step_predecessor verification.test_four_state_terminal_bridge verification.test_four_state_bridge_graph verification.test_four_state_bridge_branching verification.test_four_state_position_guard verification.test_four_state_cell_position_guard
          python verification/check_four_state_cell_position_guard.py --root . --output /tmp/run231_checks.json
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          d=json.load(open('/tmp/run231_checks.json'))
          assert d['gate_A']=='blocked'
          assert d['both_full_cells_excluded'] and d['run230_zero_slice_reproduced']
          assert d['horizon']==25
          assert Q(d['strict_margin_above_pmax'])==Q(461731712952866342887537,25000000000000000000000000)
          print('Run231 full-cell exclusion exact assertions passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run231-exact-full-cell-guard-json
          path: /tmp/run231_checks.json
