name: Run271 MMS true-history membership
on:
  pull_request:
    paths:
      - 'verification/check_run271_mms_history_membership.py'
      - 'verification/test_run271_mms_history_membership.py'
      - 'results/run271_mms_history_membership_20261102/checks.json'
      - '.github/workflows/run271-mms-history-membership.yml'
  push:
    branches: [main]
    paths:
      - 'verification/check_run271_mms_history_membership.py'
      - 'verification/test_run271_mms_history_membership.py'
      - 'results/run271_mms_history_membership_20261102/checks.json'
      - '.github/workflows/run271-mms-history-membership.yml'
jobs:
  run271:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m py_compile verification/check_run271_mms_history_membership.py verification/test_run271_mms_history_membership.py
      - name: Focused Run26x/271 regression
        run: PYTHONPATH=verification python -m unittest discover -s verification -p 'test_run2[67]*.py' -v
      - name: Frozen config, Run260/270 cross-check and exact archive
        run: |
          python verification/check_run271_mms_history_membership.py --root . --output /tmp/run271_checks.json
          diff -u results/run271_mms_history_membership_20261102/checks.json /tmp/run271_checks.json
